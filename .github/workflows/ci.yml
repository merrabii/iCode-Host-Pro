# CI (GO socle P9 / lot E1 — revue Q10) — pipeline exécutant les tests
# UNITAIRES puis les tests d'intégration e2e contre un PostgreSQL de service
# isolé, plus les 4 suites legacy 17B sur leurs bases dédiées refabriquées.
#
# Notes de chantier :
#  - aucune seed n'est nécessaire : chaque spec crée ses fixtures ;
#  - MailTransportFactory / PanelTransportFactory sont stubbés dans les specs
#    (aucun SMTP ni panneau réel) ;
#  - les timers (sweep commande + renouvellement) sont OFF par défaut (Q6,
#    activation explicite =true) ; les `false` ci-dessous restent posés à titre
#    défensif et explicite — les specs pilotent les sweeps à la main ;
#  - PAYMENT_SIMULATOR_ENABLED n'est PAS défini : les specs le pilotent elles-
#    mêmes (activation/refus) ;
#  - PAYMENT_SIMULATOR_ENABLED n'est PAS defini : les specs le pilotent elles-
#    memes (activation/refus) ;
#  - ENCRYPTION_KEY n'est PAS une cle live : elle est GENÉRÉE pour chaque job
#    (node crypto.randomBytes(32)) puis ecrite dans $GITHUB_ENV - CryptoService accepte
#    une chaine de n'importe quelle longueur (sha256 -> 32 octets). Aucune copie
#    d'un .env local, la valeur n'est jamais affichee ;
#  - les pre-requis d'environnement des tests sont verifies par une etape fail-fast
#    dediee (DATABASE_URL / PORT / JWT_SECRET / ENCRYPTION_KEY) - cela ne remplace
#    pas les controles applicatifs, il les precise seulement.
#  - `next build` est exécuté avec `--max-old-space-size=6144` (Q10 : exit 134
#    = OOM du HEAP V8 par défaut, pas de la RAM machine — même fix local).
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + e2e (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icode
          POSTGRES_PASSWORD: icode
          POSTGRES_DB: icode_host_pro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://icode:icode@localhost:5432/icode_host_pro_ci
      PORT: 3000
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      ORDER_SWEEP_ENABLED: 'false'
      RENEWAL_SWEEP_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La version de pnpm est déduite du champ `packageManager` de la racine.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cle de chiffrement SYNTHETIQUE, generee pour CE job (jamais une cle live,
      # jamais copiee d'un .env local). Ecrite dans $GITHUB_ENV => disponible
      # dans TOUTES les etapes suivantes (migrations, unit, e2e, legacy) ; la
      # valeur n'est jamais affichee dans les logs.
      - name: Generate synthetic ENCRYPTION_KEY (tests only)
        run: |
          set -euo pipefail
          KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          if [ "${#KEY}" -ne 64 ]; then echo "::error::ENCRYPTION_KEY generation invalide"; exit 1; fi
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY generee pour ce job (64 hex, valeur non affichee)."

      # Pre-requis explicites des tests : echec immediat si une variable
      # indispensable manque - ne remplace PAS les controles applicatifs,
      # il les rend visibles dans le workflow.
      - name: Verify test env prerequisites (fail fast)
        run: |
          set -euo pipefail
          missing=0
          for v in DATABASE_URL PORT JWT_SECRET ENCRYPTION_KEY; do
            if [ -z "${!v:-}" ]; then echo "::error::variable $v absente du job"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Pre-requis OK (valeurs non affichees) : DATABASE_URL PORT JWT_SECRET ENCRYPTION_KEY"
      - name: Install (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm -C apps/api exec prisma generate

      - name: Migrations (schéma complet)
        run: pnpm -C apps/api exec prisma migrate deploy

      - name: Typecheck API
        run: pnpm -C apps/api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck Web
        run: pnpm -C apps/web exec tsc --noEmit -p tsconfig.json

      - name: Build web (next build — fix heap Q10)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm -C apps/web exec next build

      - name: Tests unitaires (API)
        run: pnpm -C apps/api exec jest src --maxWorkers=4

      - name: Tests e2e (API, base CI isolée)
        # Les 4 suites legacy 17B (c3-premig / c4-premig / c4-release /
        # c4-rollback) s'exécutent dans l'étape dédiée ci-dessous : elles
        # exigent chacune SA base dédiée (garde current_database()) — impossible
        # de les mixter avec la base CI principale. Leurs bases sont refabriquées
        # à l'étape « bases dédiées » (migrate complet, 60 migrations, puis
        # retrait des tables C1/C3/C4 pour l'état pré-migratoire).
        run: >-
          pnpm -C apps/api exec jest --config ./test/jest-e2e.json --runInBand
          --testPathIgnorePatterns c3-premig c4-premig c4-release c4-rollback

      - name: Bases dédiées des suites legacy 17B (refabrique Q10)
        # Recette reproductible (identique à la refabrique locale Q10) :
        #   1. 3 bases NEUVES (le service Postgres est jeté à chaque job :
        #      la préparation ne dépend d'aucune base locale préparée) ;
        #   2. migrate deploy complet (schéma courant) sur chacune ;
        #   3. c3premig : DROP C1/C3/C4 = état « pré-migrations » historique
        #      — ordre des dépendances : enfants AVANT parents
        #      (OrderProvisioningTracking → Order ; HostingServiceAllocation
        #      → HostingService en ON DELETE RESTRICT ⇒ allocation déposée
        #      avant le service, dont les FK résiduelles de ClientProject et
        #      Deployment tombent en CASCADE) ; tables C4 sans FK (ordre libre) ;
        #   4. c4premig : DROP des 5 tables C4 SEULEMENT (aucune FK vers/depuis
        #      ces tables — ordre indifférent) ; le reste du schéma (dont
        #      HostingService) reste intact : état « pré-migration C4 » ;
        #   5. c4test : base COMPLÈTE (C4 présent) = c4-release/c4-rollback.
        # Aucun DROP DATABASE ici : les bases/preuves historiques ne sont
        # jamais effacées.
        env:
          PGPASSWORD: icode
        run: |
          set -euo pipefail
          PSQL="psql postgresql://icode:icode@localhost:5432/postgres -v ON_ERROR_STOP=1 -q"
          $PSQL -c 'CREATE DATABASE icode_host_pro_c3premig'
          $PSQL -c 'CREATE DATABASE icode_host_pro_c4premig'
          $PSQL -c 'CREATE DATABASE icode_host_pro_c4test'
          for db in icode_host_pro_c3premig icode_host_pro_c4premig icode_host_pro_c4test; do
            DATABASE_URL="postgresql://icode:icode@localhost:5432/$db" \
              pnpm -C apps/api exec prisma migrate deploy
          done
          psql "postgresql://icode:icode@localhost:5432/icode_host_pro_c3premig" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS "OrderProvisioningTracking";
          DROP TABLE IF EXISTS "HostingServiceAllocation";
          DROP TABLE IF EXISTS "HostingService" CASCADE;
          DROP TABLE IF EXISTS "C4ProviderAttempt";
          DROP TABLE IF EXISTS "C4Takeover";
          DROP TABLE IF EXISTS "C4StopRequest";
          DROP TABLE IF EXISTS "C4ReleaseEvidence";
          DROP TABLE IF EXISTS "C4ReadinessProof";
          SQL
          psql "postgresql://icode:icode@localhost:5432/icode_host_pro_c4premig" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS "C4ProviderAttempt";
          DROP TABLE IF EXISTS "C4Takeover";
          DROP TABLE IF EXISTS "C4StopRequest";
          DROP TABLE IF EXISTS "C4ReleaseEvidence";
          DROP TABLE IF EXISTS "C4ReadinessProof";
          SQL

      - name: Préconditions effectives des bases legacy avant suites
        # Fail-closed : chaque base doit présenter EXACTEMENT l'état attendu
        # par sa suite (miroir des gardes current_database()/to_regclass des
        # specs) AVANT tout lancement — une préparation incomplète ou une
        # base héritée d'un run précédent casse ici, pas au milieu des tests.
        env:
          PGPASSWORD: icode
        run: |
          set -euo pipefail
          psql "postgresql://icode:icode@localhost:5432/icode_host_pro_c3premig" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF current_database() <> 'icode_host_pro_c3premig' THEN
              RAISE EXCEPTION 'c3premig: identité % inattendue', current_database();
            END IF;
            IF to_regclass('public."OrderProvisioningTracking"') IS NOT NULL
               OR to_regclass('public."HostingServiceAllocation"') IS NOT NULL
               OR to_regclass('public."HostingService"') IS NOT NULL
               OR to_regclass('public."C4ProviderAttempt"') IS NOT NULL THEN
              RAISE EXCEPTION 'c3premig: DROP pré-migratoire incomplet (table C1/C3/C4 encore présente)';
            END IF;
            IF to_regclass('public."Order"') IS NULL OR to_regclass('public."Product"') IS NULL THEN
              RAISE EXCEPTION 'c3premig: socle métier absent (préparation invalide)';
            END IF;
          END $$;
          SQL
          psql "postgresql://icode:icode@localhost:5432/icode_host_pro_c4premig" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF current_database() <> 'icode_host_pro_c4premig' THEN
              RAISE EXCEPTION 'c4premig: identité % inattendue', current_database();
            END IF;
            IF to_regclass('public."C4ProviderAttempt"') IS NOT NULL
               OR to_regclass('public."C4Takeover"') IS NOT NULL
               OR to_regclass('public."C4StopRequest"') IS NOT NULL
               OR to_regclass('public."C4ReleaseEvidence"') IS NOT NULL
               OR to_regclass('public."C4ReadinessProof"') IS NOT NULL THEN
              RAISE EXCEPTION 'c4premig: tables C4 encore présentes (DROP C4 manquant dans la préparation)';
            END IF;
            IF to_regclass('public."HostingService"') IS NULL
               OR to_regclass('public."HostingServiceAllocation"') IS NULL
               OR to_regclass('public."Order"') IS NULL THEN
              RAISE EXCEPTION 'c4premig: schéma non-C4 à tort retiré (préparation trop agressive)';
            END IF;
          END $$;
          SQL
          psql "postgresql://icode:icode@localhost:5432/icode_host_pro_c4test" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF current_database() <> 'icode_host_pro_c4test' THEN
              RAISE EXCEPTION 'c4test: identité % inattendue', current_database();
            END IF;
            IF to_regclass('public."C4ProviderAttempt"') IS NULL
               OR to_regclass('public."C4Takeover"') IS NULL
               OR to_regclass('public."C4StopRequest"') IS NULL
               OR to_regclass('public."C4ReleaseEvidence"') IS NULL
               OR to_regclass('public."C4ReadinessProof"') IS NULL THEN
              RAISE EXCEPTION 'c4test: tables C4 absentes (base incomplète pour c4-release/c4-rollback)';
            END IF;
          END $$;
          SQL

      - name: Tests e2e legacy 17B (4 suites, bases dédiées)
        # 3 suites = 3 bases (une garde d'identité par suite) ; c4-release et
        # c4-rollback partagent icode_host_pro_c4test (lancées ensemble).
        env:
          PGPASSWORD: icode
        run: |
          set -euo pipefail
          DATABASE_URL="postgresql://icode:icode@localhost:5432/icode_host_pro_c3premig" \
            pnpm -C apps/api exec jest --config ./test/jest-e2e.json --runInBand c3-premig
          DATABASE_URL="postgresql://icode:icode@localhost:5432/icode_host_pro_c4premig" \
            pnpm -C apps/api exec jest --config ./test/jest-e2e.json --runInBand c4-premig
          DATABASE_URL="postgresql://icode:icode@localhost:5432/icode_host_pro_c4test" \
            pnpm -C apps/api exec jest --config ./test/jest-e2e.json --runInBand c4-release c4-rollback
