# Code Diali — reverse proxy Caddy pour la préproduction (GO V3).
#
# Ce proxy fournit l'accès direct HTTPS sans tunnel SSH, hors Coolify.
# Il résout `web` par DNS Docker (aucune IP conteneur figée).
#
# USAGE (sur la VM préproduction) :
#   # 1. Générer le certificat auto-signé (une seule fois) :
#   mkdir -p /home/mourad/preprod-proxy/{certs,caddy_config,caddy_data}
#   openssl req -x509 -newkey rsa:4096 -nodes -days 3650 \
#     -keyout /home/mourad/preprod-proxy/certs/server.key \
#     -out /home/mourad/preprod-proxy/certs/server.crt \
#     -subj "/CN=172.31.47.238" \
#     -addext "subjectAltName=IP:172.31.47.238"
#   chmod 600 /home/mourad/preprod-proxy/certs/server.key
#   chmod 644 /home/mourad/preprod-proxy/certs/server.crt
#
#   # 2. Placer le Caddyfile (voir fichier fourni) :
#   #    /home/mourad/preprod-proxy/Caddyfile
#
#   # 3. Démarrer le proxy :
#   docker compose -f deploy/docker-compose.proxy.yml up -d
#
#   # 4. Arrêter le proxy :
#   docker compose -f deploy/docker-compose.proxy.yml down
#
# PORTS :
#   3212 → 80  (HTTP, redirection vers HTTPS non configurée — accès direct)
#   3443 → 443 (HTTPS, cert auto-signé)
#
# RÉSEAU : rejoint le réseau de la stack préprod (uawjvxk573pyx13v6o8bgxpp)
# pour résoudre `web` par DNS Docker. Aucune IP conteneur n'est figée.
#
# PostgreSQL n'est PAS publié. L'API n'est PAS publiée directement.
# Le web gère /api/* via le rewrite API_UPSTREAM=http://api:3001.
#
# CERTIFICAT : auto-signé, CN=IP, 10 ans. L'utilisateur doit importer le .crt
# dans son magasin de confiance (procédure manuelle, aucune installation
# silencieuse). Empreinte SHA-256 à conserver pour vérification.

services:
  preprod-proxy:
    image: caddy:2-alpine
    container_name: preprod-proxy
    restart: unless-stopped
    networks:
      - preprod
    ports:
      - "3212:80"
      - "3443:443"
    volumes:
      - /home/mourad/preprod-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/mourad/preprod-proxy/certs:/certs:ro
      - /home/mourad/preprod-proxy/caddy_config:/config
      - /home/mourad/preprod-proxy/caddy_data:/data

networks:
  preprod:
    external: true
    name: uawjvxk573pyx13v6o8bgxpp
