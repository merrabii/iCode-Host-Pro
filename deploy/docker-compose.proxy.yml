# Code Diali — reverse proxy Caddy pour la préproduction (GO V3).
#
# Ce proxy fournit l'accès direct HTTPS sans tunnel SSH, hors Coolify.
# Il résout `web` par DNS Docker (aucune IP conteneur figée).
#
# USAGE (sur la VM préproduction) — CHEMINS & RÉSEAU CONFIGURABLES, AUCUN REPLI :
#   # 1) Renseigner dans deploy/.env (ou l'environnement du processus) :
#   #      PREPROD_NETWORK=<réseau externe du projet cible — en preprod l'UUID
#   #        projet Coolify, visible via label com.docker.compose.project des
#   #        conteneurs du projet ; en local <COMPOSE_PROJECT_NAME>_default>
#   #      PREPROD_PROXY_DIR=<dossier hôte proxy — ex. /home/mourad/preprod-proxy>
#   #    config absente = refus compose avec message clair (jamais de valeur
#   #    en dur, jamais de repli sur l'UUID d'une VM de test).
#   # 2) Générer le certificat auto-signé (IP ou domaine = argument OBLIGATOIRE),
#   #    en transmettant la valeur explicitement — le script ne lit PAS deploy/.env :
#   #      PREPROD_PROXY_DIR="/chemin/choisi/preprod-proxy" \
#   #        bash ./deploy/scripts/gen-preprod-cert.sh <IP-ou-domaine>
#   #    (dossier des certs configurable : CERT_DIR, défaut $PREPROD_PROXY_DIR/certs ;
#   #     valeur à garder IDENTIQUE à PREPROD_PROXY_DIR de deploy/.env, car Compose
#   #     monte ensuite $PREPROD_PROXY_DIR/certs dans /certs du proxy)
#   # 3) Placer le Caddyfile (modèle : recette preprod-proxy-Caddyfile.txt) :
#   #      $PREPROD_PROXY_DIR/Caddyfile
#   # 4) Démarrer le proxy :
#   #      docker compose -f deploy/docker-compose.proxy.yml up -d
#   # 5) Arrêter le proxy :
#   #      docker compose -f deploy/docker-compose.proxy.yml down
#
# PORTS :
#   3212 → 80  (HTTP, redirection vers HTTPS non configurée — accès direct)
#   3443 → 443 (HTTPS, cert auto-signé)
#
# RÉSEAU : rejoint le réseau de la stack préprod (nom ci-dessous) pour résoudre
# `web` par DNS Docker. Aucune IP conteneur n'est figée. Le nom du réseau est
# celui créé par Coolify pour le projet cible (UUID projet Coolify).
# PREPROD_NETWORK est OBLIGATOIRE (gardé ${VAR:?}) : config absente = refus
# compose avec message clair — aucun UUID en dur, aucun repli silencieux.
#
# PostgreSQL n'est PAS publié. L'API n'est PAS publiée directement.
# Le web gère /api/* via le rewrite API_UPSTREAM=http://api:3001.
#
# CERTIFICAT : auto-signé, CN=IP, 10 ans. L'utilisateur doit importer le .crt
# dans son magasin de confiance (procédure manuelle, aucune installation
# silencieuse). Empreinte SHA-256 à conserver pour vérification.

services:
  preprod-proxy:
    image: caddy:2-alpine
    container_name: preprod-proxy
    restart: unless-stopped
    networks:
      - preprod
    ports:
      - "3212:80"
      - "3443:443"
    volumes:
      - ${PREPROD_PROXY_DIR:?PREPROD_PROXY_DIR obligatoire — dossier hôte du proxy (ex. /home/mourad/preprod-proxy)}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PREPROD_PROXY_DIR:?PREPROD_PROXY_DIR obligatoire — dossier hôte du proxy (ex. /home/mourad/preprod-proxy)}/certs:/certs:ro
      - ${PREPROD_PROXY_DIR:?PREPROD_PROXY_DIR obligatoire — dossier hôte du proxy (ex. /home/mourad/preprod-proxy)}/caddy_config:/config
      - ${PREPROD_PROXY_DIR:?PREPROD_PROXY_DIR obligatoire — dossier hôte du proxy (ex. /home/mourad/preprod-proxy)}/caddy_data:/data

networks:
  preprod:
    external: true
    name: ${PREPROD_NETWORK:?PREPROD_NETWORK obligatoire — réseau externe du projet cible (labels docker, ex. UUID projet Coolify)}
