# Code Diali — orchestration de déploiement (parcours : VPS dédié + projet
# Coolify isolé). DÉFAUT = CONFIGURATION PRODUCTION : aucun service n'est
# publié sur l'hôte (ni PostgreSQL, ni API, ni Web). Coolify = autorité unique
# reverse proxy/HTTPS (routes du projet Coolify, jamais ce fichier en prod).
#
# Validation LAN : charger AUSSI docker-compose.lan.yml (override) :
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
# L'override LAN publie API 3111 / Web 3112 / PG 5433 pour la CONSULTATION
# depuis l'hôte. HONNÊTETÉ : cette override ne fournit AUCUNE isolation
# réseau (egress ouvert). L'isolation egress = mode dédié sans ports :
#   docker compose -f docker-compose.yml -f docker-compose.lan-internal.yml up -d
#
# RÈGLES :
# - Aucune valeur secrète ici : env_file hors Git ou variables injectées.
# - Aucun migrate/seed au démarrage : jobs explicites (profil "ops").
# - Noms/volumes préfixés "cdiali-" : aucune collision avec une stack existante.
# - x-api-env : ancre UNIQUE partagée par `api` ET `check-gates` — l'env du
#   checker est constructuellement celui du service API (pas deux copies).
#
# COMPATIBILITÉ COOLIFY + GARDES RÉELLEMENT EXÉCUTÉES (GO V4) :
# - Ce fichier n'utilise JAMAIS ${VAR:?} — le validateur Coolify 4.4.6 ne le
#   supporte pas — et ne contient AUCUN montage ${VAR:-/nonexistent}.
# - Les valeurs obligatoires sont vérifiées par le service one-shot
#   `preflight` (deploy/scripts/preflight.sh) qui s'exécute AVANT db/api/web
#   (depends_on: condition: service_completed_successfully) sur les MÊMES
#   valeurs ${VAR:-} interpolées : config manquante = exit 1 = docker compose
#   up échoue = AUCUN service ne démarre. C'est ce chemin qu'emprunte un
#   déploiement Coolify officiel — aucune retouche manuelle.
# - Les jobs ops à montage hôte (migrate/backup/restore) sont dans
#   docker-compose.ops.yml (gardes ${VAR:?} strictes, jamais lu par Coolify)
#   et sont lancés par deploy/scripts/ops.sh, qui exécute preflight.sh --ops
#   (vars ops + restauration + validité des chemins hôte) avant tout conteneur.

name: code-diali

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${PG_USER:-}:${PG_PASSWORD:-}@db:5432/${PG_DB:-}?schema=public
  PORT: "3001"
  JWT_SECRET: ${JWT_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  WEB_ORIGIN: ${WEB_ORIGIN:-}
  # URL API vue par le NAVIGATEUR (pages de paiement hébergées, PUBLIC_API_BASE
  # lue par payment-provider.service). Runtime.
  PUBLIC_API_BASE: ${PUBLIC_API_BASE:-${NEXT_PUBLIC_API_URL:-}}
  # Derrière un reverse proxy local (Coolify/docker network) : uniquelocal =
  # RFC1918 (réseaux docker) ; "true" est REFUSÉ par le code (forgeable).
  TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
  # Premiers démarrages — gates OFF explicites (GO §5). L'activation se fait
  # ensuite par l'admin (base) ou par décision documentée (env).
  PAYMENT_SIMULATOR_ENABLED: "false"
  HOSTING_C2_ENABLED: "false"
  HOSTING_C3_ENABLED: "false"
  HOSTING_C4_ENABLED: "false"
  ORDER_SWEEP_ENABLED: "false"
  RENEWAL_SWEEP_ENABLED: "false"
  RECONCILE_ENABLED: "false"

services:
  # Contrôle préalable RÉELLEMENT EXÉCUTÉ à chaque démarrage (GO V4).
  # - One-shot : exit 0 = conforme ; exit 1 = docker compose up échoue, db/api/web
  #   ne démarrent pas (déploiement Coolify refusé tel quel, stack existante en
  #   place non modifiée).
  # - Env = les MÊMES ${VAR:-} que db/api/web (interpolation du même fichier) :
  #   ce qui est testé est constructuellement ce qui est distribué. Un espace
  #   réservé vide est un échec (comme l'aurait été ${VAR:?} interdit ici).
  # - Rebuilt à chaque build (image du projet : <projet>_preflight), aucun
  #   argument de build, aucune écriture, contrôle seul.
  preflight:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    restart: "no"
    entrypoint: ["bash", "/opt/code-diali/scripts/preflight.sh"]
    environment:
      PG_USER: ${PG_USER:-}
      PG_PASSWORD: ${PG_PASSWORD:-}
      PG_DB: ${PG_DB:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${PG_USER:-}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: ${PG_DB:-}
    volumes:
      # Clés en HYPHENS (et non underscores) : compose 5.5 (artefact Coolify)
      # normalise les clés « cdiali_pg » en « cdiali-pg » alors que compose 5.6
      # local (ops.sh) les conservait tels quels → DEUX volumes distincts, le
      # second restait vierge → crash P2021 (table absente) au redéploiement
      # (incident du 18/10/2026). Avec des hyphens, les deux chemins convergent
      # sur le même volume : clé = nom réellement monté partout.
      - cdiali-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
    volumes:
      - cdiali-storage:/repo/apps/api/storage
      - cdiali-branding:/repo/apps/api/public/branding
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # URL de l'API vue PAR LE CONTENEUR WEB (résolution DNS compose —
        # jamais localhost entre conteneurs). FIGÉ AU BUILD (rebuild exigé
        # pour tout changement — n'est PAS modifiable au runtime).
        API_UPSTREAM: http://api:3001
        # URL de l'API vue PAR LE NAVIGATEUR — INLINÉE AU BUILD dans le bundle
        # Next (NEXT_PUBLIC_*) : la modifier au runtime ne change RIEN côté
        # navigateur ; tout changement exige un REBUILD du service web.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Repli runtime interne pour les requêtes serveur du web :
      API_UPSTREAM: http://api:3001
    expose:
      - "3000"

  # Jobs ops SANS montage hôte — restent ici car `check-gates` partage
  # l'ancre x-api-env avec `api` (les ancres YAML ne traversent PAS deux
  # fichiers compose). Profil "ops" : jamais démarrés par un simple
  # "docker compose up". Lancement documenté : deploy/scripts/ops.sh
  # (preflight runtime exécuté avant chaque commande).
  # Les jobs migrate/backup/restore (montage hôte + gardes ${VAR:?} strictes)
  # vivent dans docker-compose.ops.yml.

  # Gates premier démarrage — MÊME env que le service api (ancre x-api-env) :
  #   ./scripts/ops.sh check-gates --first-boot
  check-gates:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
    entrypoint: ["node", "/opt/code-diali/scripts/bootstrap-check.mjs"]

  # Seed admin initial (ADR-017) — explicite uniquement :
  #   ./scripts/ops.sh seed-admin -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=...
  seed-admin:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PG_USER:-}:${PG_PASSWORD:-}@db:5432/${PG_DB:-}?schema=public
    working_dir: /repo/apps/api
    entrypoint: ["npx", "prisma", "db", "seed"]

volumes:
  cdiali-pg:
  cdiali-storage:
  cdiali-branding:
