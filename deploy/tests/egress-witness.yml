# Code Diali — témoin local pour campagne d'isolation egress.
#
# Topologie de campagne :
#   - Réseau ISOLÉ (internal:true) : api, web, db — AUCUNE route sortante.
#   - Réseau EXTERNE (bridge par défaut) : witness — accessible depuis l'hôte,
#     INACCESSIBLE depuis le réseau isolé (internal:true bloque les routes
#     sortantes vers les autres réseaux Docker).
#
# Prouve que :
#   1. Le témoin répond depuis le contrôle (hôte) → le réseau externe fonctionne.
#   2. Le témoin est INACCESSIBLE depuis la stack isolée → l'isolation est réelle.
#   3. Internet est inaccessible depuis la stack isolée → pas d'appel provider.
#
# Usage (EN COMPLÉMENT de docker-compose.yml + lan-internal.yml) :
#   docker compose -f docker-compose.yml -f docker-compose.lan-internal.yml \
#     -f deploy/tests/egress-witness.yml up -d
#
# Ce fichier n'est JAMAIS chargé en production.

networks:
  # Réseau externe : le witness vit ici, accessible depuis l'hôte.
  witness-net:
    driver: bridge
    internal: false

services:
  witness:
    image: nginx:1.27-alpine
    restart: "no"
    networks:
      - witness-net
    # Config nginx minimal : écouter sur 8080, servir WITNESS_OK.
    tmpfs:
      - /etc/nginx/conf.d
      - /usr/share/nginx/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf << 'NGINX'
        server {
          listen 8080;
          server_name _;
          location / {
            return 200 'WITNESS_OK';
            add_header Content-Type text/plain;
          }
        }
        NGINX
        echo 'WITNESS_OK' > /usr/share/nginx/html/index.html
        exec nginx -g 'daemon off;'
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
